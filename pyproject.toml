[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-agent-stack"
version = "0.6.6"
description = "A bounded engineering multi-agent stack and distribution CLI for Codex."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Nguyễn Khắc Tùng Lâm (Tùng Lâm Automation)"}]
dependencies = [
  "PyYAML>=6.0.2,<7",
  "tomli>=2.0.1,<3; python_version < '3.11'",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.scripts]
eas = "eas_cli.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["eas_cli*", "runtime*"]
namespaces = false

[tool.setuptools.package-data]
"runtime.capabilities" = ["resources/extensions/**/*.yaml", "resources/extensions/**/*.md"]
