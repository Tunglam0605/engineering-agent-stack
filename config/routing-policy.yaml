version: 5
status: candidate
default: direct
rules:
  - id: critical-independent-review
    when:
      task_shape: review
      review_stage: independent
      risk: critical
    action: delegate
    role: reviewer
    profile: critical
  - id: critical-gate
    when:
      risk: critical
    action: delegate
    role: architect
    profile: critical
  - id: trivial-direct
    when:
      task_complexity: trivial
      risk: low
    action: direct
  - id: discovery-cheap
    when:
      task_shape: discovery
      risk: low
    action: delegate
    role: scout
    profile: cheap
  - id: research-cheap
    when:
      task_shape: external-research
      risk: low
    action: delegate
    role: researcher
    profile: cheap
  - id: ordinary-implementation
    when:
      task_shape: implementation
      risk: normal
    action: delegate
    role: implementer
    profile: standard
  - id: hard-debug
    when:
      task_shape: debugging
      uncertainty: high
    action: delegate
    role: debugger
    profile: deep
  - id: independent-review
    when:
      task_shape: review
      review_stage: independent
    action: delegate
    role: reviewer
    profile: deep
quality_gate:
  review_required_for:
    - high-risk
    - critical-risk
    - release-critical
  verify_every_change: true
lifecycle:
  reuse_strategy: resume-before-spawn
  reuse_match_keys:
    - role
    - task_domain
    - write_scope
  spawn_new_only_when:
    - independent_parallelism_materially_improves_elapsed_time
    - independent_review_requires_separate_context
    - existing_child_context_is_stale_or_wrong
  naming:
    format: "<role>: <domain>"
    avoid_version_suffix: true
limits:
  default_max_parallel_readers: 3
  default_max_parallel_writers: 1
  recursive_delegation: false
  soft_max_child_assignments_per_goal: 8
  hard_max_child_assignments_per_goal: 12
  default_max_architect_assignments_per_goal: 1
  default_max_reviewer_assignments_per_change_set: 1
  max_same_role_domain_scope_active: 1
notes:
  - Rule order is significant; the first matching rule wins.
  - Critical risk is gated before normal task-shape routing; an independent critical review remains a reviewer task at the critical profile.
  - This file routes already-classified signals. Natural-language task classification is evaluated separately.
  - Lifecycle limits are orchestration policy, not a claim that provider-native spawn APIs are transparently intercepted.
  - At the soft goal budget, reconcile/reuse existing children before any new spawn; at the hard ordinary-spawn ceiling, integrate, serialize, or escalate instead of creating more children.
