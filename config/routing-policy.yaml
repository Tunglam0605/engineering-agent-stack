version: 3
status: candidate
default: direct
rules:
  - id: critical-independent-review
    when:
      task_shape: review
      review_stage: independent
      risk: critical
    action: delegate
    role: reviewer
    profile: critical
  - id: critical-gate
    when:
      risk: critical
    action: delegate
    role: architect
    profile: critical
  - id: trivial-direct
    when:
      task_complexity: trivial
      risk: low
    action: direct
  - id: discovery-cheap
    when:
      task_shape: discovery
      risk: low
    action: delegate
    role: scout
    profile: cheap
  - id: research-cheap
    when:
      task_shape: external-research
      risk: low
    action: delegate
    role: researcher
    profile: cheap
  - id: ordinary-implementation
    when:
      task_shape: implementation
      risk: normal
    action: delegate
    role: implementer
    profile: standard
  - id: hard-debug
    when:
      task_shape: debugging
      uncertainty: high
    action: delegate
    role: debugger
    profile: deep
  - id: independent-review
    when:
      task_shape: review
      review_stage: independent
    action: delegate
    role: reviewer
    profile: deep
quality_gate:
  review_required_for:
    - high-risk
    - critical-risk
    - release-critical
  verify_every_change: true
limits:
  default_max_parallel_readers: 4
  default_max_parallel_writers: 1
  recursive_delegation: false
notes:
  - Rule order is significant; the first matching rule wins.
  - Critical risk is gated before normal task-shape routing; an independent critical review remains a reviewer task at the critical profile.
  - This file routes already-classified signals. Natural-language task classification is evaluated separately.
