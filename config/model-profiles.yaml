version: 3
status: candidate
verified_against_openai_docs: 2026-09-23
principle: role-and-compute-profile-are-independent
profiles:
  cheap:
    purpose:
      - repository scanning
      - classification
      - simple validation
      - high-volume bounded work
    reasoning: low
    candidate_models:
      openai: gpt-6-luna
    benchmark_baselines:
      openai:
        - gpt-5.6-luna
    escalation_to: standard
  standard:
    purpose:
      - ordinary implementation
      - ordinary debugging
      - test authoring
      - routine technical research
    reasoning: medium
    candidate_models:
      openai: gpt-6-sol
    benchmark_candidates:
      openai:
        - gpt-6-luna
    benchmark_baselines:
      openai:
        - gpt-5.6-terra
    escalation_to: deep
  deep:
    purpose:
      - difficult root-cause analysis
      - complex implementation
      - high-confidence independent review
    reasoning: high
    candidate_models:
      openai: gpt-6-sol
    benchmark_candidates:
      openai:
        - gpt-6-luna
    benchmark_baselines:
      openai:
        - gpt-5.6-terra
    escalation_to: critical
  critical:
    purpose:
      - architecture
      - security-sensitive decisions
      - realtime and safety-critical review
      - release-critical assurance
    reasoning: high
    candidate_models:
      openai: gpt-6-sol
    benchmark_candidates:
      openai:
        - gpt-6-astra
    benchmark_baselines:
      openai:
        - gpt-5.6-sol
    escalation_to: null
notes:
  - Candidate model mappings are not role identity.
  - GPT-6 Sol and GPT-6 Luna model IDs and reasoning tiers were revalidated against OpenAI documentation on 2026-09-23.
  - GPT-6 Luna is the default cheap/high-volume tier; standard, deep and critical initially resolve to GPT-6 Sol.
  - GPT-6 Luna remains a benchmark candidate for standard/deep work and must clear the same quality threshold before any wider promotion.
  - GPT-6 Astra remains a critical benchmark candidate rather than a default; use it only when measured task-level quality justifies the higher cost.
  - GPT-5.6 mappings are retained as benchmark baselines for migration evidence, not as current defaults.
  - Provider adapters may select equivalent models according to measured quality, latency, availability and cost.
  - All mappings remain benchmark-gated and must be revalidated when provider models or pricing change.
