version: 3
status: candidate
verified_against_openai_docs: 2026-09-07
principle: role-and-compute-profile-are-independent
profiles:
  cheap:
    purpose:
      - repository scanning
      - classification
      - simple validation
      - high-volume bounded work
    reasoning: low
    candidate_models:
      openai: gpt-5.6-luna
    escalation_to: standard
  standard:
    purpose:
      - ordinary implementation
      - ordinary debugging
      - test authoring
      - routine technical research
    reasoning: medium
    candidate_models:
      openai: gpt-5.6-terra
    escalation_to: deep
  deep:
    purpose:
      - difficult root-cause analysis
      - complex implementation
      - high-confidence independent review
    reasoning: high
    candidate_models:
      openai: gpt-5.6-terra
    escalation_to: critical
  critical:
    purpose:
      - architecture
      - security-sensitive decisions
      - realtime and safety-critical review
      - release-critical assurance
    reasoning: high
    candidate_models:
      openai: gpt-5.6-sol
    benchmark_candidates:
      openai:
        - gpt-6-astra
    escalation_to: null
notes:
  - Candidate model mappings are not role identity.
  - GPT-5.6 Sol's current API model ID is `gpt-5.6-sol`; `gpt-5.6` is a documented alias.
  - GPT-6 Astra is not a default because its higher per-token price must be justified by measured task-level quality/cost gain.
  - Provider adapters may select equivalent models according to measured quality, latency, availability and cost.
  - All mappings remain benchmark-gated and must be revalidated when provider models or pricing change.
