version: 3
status: policy-fixtures
eval_kind: deterministic-policy-routing
cases:
  - id: typo-in-readme
    task: Fix one obvious typo in README with no behavioral effect.
    signals:
      task_complexity: trivial
      risk: low
    expected:
      action: direct
      review_required: false
      max_parallel_agents: 0

  - id: locate-metadata-refresh
    task: Find where metadata refresh is triggered after flashing and report the call path without editing.
    signals:
      task_shape: discovery
      risk: low
    expected:
      action: delegate
      role: scout
      profile: cheap
      review_required: false

  - id: external-api-version
    task: Confirm current official API behavior for a chosen dependency version without changing code.
    signals:
      task_shape: external-research
      risk: low
    expected:
      action: delegate
      role: researcher
      profile: cheap
      review_required: false

  - id: bounded-python-fix
    task: Implement an already-understood bug fix in two known Python files and run targeted tests.
    signals:
      task_shape: implementation
      risk: normal
    expected:
      action: delegate
      role: implementer
      profile: standard
      review_required: false

  - id: intermittent-race
    task: Diagnose an intermittent concurrency failure with conflicting logs and no proven root cause.
    signals:
      task_shape: debugging
      uncertainty: high
      risk: high
      review_class: high-risk
    expected:
      action: delegate
      role: debugger
      profile: deep
      review_required: true

  - id: critical-debug-pre-gate
    task: Diagnose a release-blocking realtime memory-safety failure in a critical control path.
    signals:
      task_shape: debugging
      uncertainty: high
      risk: critical
      review_class: critical-risk
    expected:
      action: delegate
      role: architect
      profile: critical
      review_required: true

  - id: stm32-realtime-change
    task: Change logic inside a 1 kHz STM32 control path involving ISR/DMA interaction and release safety.
    signals:
      task_shape: architecture
      risk: critical
      review_class: critical-risk
    expected:
      action: delegate
      role: architect
      profile: critical
      review_required: true

  - id: release-review
    task: Independently review a release candidate after implementation and tests are complete.
    signals:
      task_shape: review
      review_stage: independent
      risk: high
      review_class: release-critical
    expected:
      action: delegate
      role: reviewer
      profile: deep
      review_required: true

  - id: critical-release-review
    task: Independently review a safety-critical release candidate with completed implementation evidence.
    signals:
      task_shape: review
      review_stage: independent
      risk: critical
      review_class: release-critical
    expected:
      action: delegate
      role: reviewer
      profile: critical
      review_required: true

  - id: redundant-agent-fanout
    task: Rename one local variable in one private function while preserving behavior.
    signals:
      task_complexity: trivial
      risk: low
    expected:
      action: direct
      review_required: false
      max_parallel_agents: 0
