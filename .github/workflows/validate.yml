name: Validate agent stack

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q scripts runtime eas_cli tests

      - name: Smoke-test locale-independent subprocess capture
        run: |
          python -c "import sys; sys.path.insert(0,'scripts'); import acceptance_core as a; p=a.run([sys.executable,'-c','import sys; sys.stdout.buffer.write(bytes([0xe2,0x9c,0x93,0x20,0xe2,0x82,0xac]))']); assert p.stdout == '\u2713 \u20ac'; assert a.parse_jsonl_text(None) == []"

      - name: Run deterministic unit tests and smoke-test provider probe configuration
        run: |
          python -m unittest discover -s tests -v
          python -c "import sys; from pathlib import Path; sys.path.insert(0,'scripts'); import provider_probe_codex as p; o=p.provider_overrides(Path('/tmp/eas-provider')); assert any(x.startswith('agents.scout.config_file=') for x in o); q=p.delegation_prompt('scout','inspect README'); assert 'agent_type `scout`' in q and 'fork_turns `none`' in q"

      - name: Validate repository structure
        run: python scripts/validate_structure.py

      - name: Validate acknowledgements and provenance
        run: python scripts/validate_provenance.py

      - name: Validate canonical agent contracts
        run: python scripts/validate_agents.py

      - name: Evaluate deterministic routing policy
        run: python scripts/evaluate_routing.py

      - name: Validate controlled benchmark tasks
        run: python scripts/validate_task_suite.py

      - name: Validate benchmark contracts
        run: python scripts/validate_benchmarks.py

      - name: Smoke-test Codex installer and parent instructions
        run: |
          mkdir -p /tmp/eas-codex-project
          git -C /tmp/eas-codex-project init
          python scripts/install_codex.py --project /tmp/eas-codex-project --project-instructions --dry-run
          python scripts/install_codex.py --project /tmp/eas-codex-project --project-instructions
          python scripts/install_codex.py --project /tmp/eas-codex-project --project-instructions --check

      - name: Smoke-test EAS distribution CLI
        run: |
          python -m eas_cli version
          python -m eas_cli doctor --json > /tmp/eas-doctor.json
          python -m pip install . --no-deps
          eas version
          sh -n install.sh
          mkdir -p /tmp/eas-cli-project
          git -C /tmp/eas-cli-project init
          python -m eas_cli init /tmp/eas-cli-project
          python -m eas_cli check --project /tmp/eas-cli-project --project-instructions
          python -m eas_cli uninstall --project /tmp/eas-cli-project --project-instructions

      - name: Smoke-test controlled task tooling
        run: |
          python scripts/grade_benchmark_task.py --task-id scout-symbol-001 --last-message benchmarks/tasks/scout-symbol-001/golden-answer.md --output /tmp/scout-grade.json
          python scripts/grade_benchmark_task.py --task-id reviewer-regression-001 --last-message benchmarks/tasks/reviewer-regression-001/golden-answer.md --output /tmp/reviewer-grade.json
          cp -R benchmarks/tasks/implementer-bounded-bug-001/workspace /tmp/impl-workspace
          cp benchmarks/tasks/implementer-bounded-bug-001/golden/retry.py /tmp/impl-workspace/src/retry.py
          python scripts/grade_benchmark_task.py --task-id implementer-bounded-bug-001 --workspace /tmp/impl-workspace --output /tmp/impl-grade.json
          cp -R benchmarks/tasks/orchestrator-trivial-edit-001/workspace /tmp/direct-workspace
          cp benchmarks/tasks/orchestrator-trivial-edit-001/golden/README.md /tmp/direct-workspace/README.md
          python scripts/grade_benchmark_task.py --task-id orchestrator-trivial-edit-001 --workspace /tmp/direct-workspace --output /tmp/direct-grade.json
          python scripts/prepare_benchmark_task.py --task-id scout-symbol-001 --experiment-id scout-luna-vs-terra --model gpt-5.6-luna --reasoning-effort medium --profile cheap --destination /tmp/prepared-scout
          python scripts/capture_codex_exec.py --manifest /tmp/prepared-scout/manifest.yaml --dry-run

      - name: Smoke-test Codex run capture pipeline
        run: |
          python scripts/capture_codex_exec.py --manifest benchmarks/run-manifest.example.yaml --dry-run
          python scripts/normalize_codex_exec.py --events benchmarks/fixtures/codex-exec-events.jsonl --manifest benchmarks/run-manifest.example.yaml --latency-ms 1234.5 --started-at 2026-09-07T00:00:00+00:00 --finished-at 2026-09-07T00:00:01.234500+00:00 --output /tmp/capture.json
          python -c "import json; d=json.load(open('/tmp/capture.json', encoding='utf-8')); e=d['event_summary']; assert e['agent_spawns'] == 1; assert e['agent_spawn_thread_ids'] == ['fixture-child-001']; assert e['agent_spawn_models'] == []; assert e['agent_spawn_roles'] == []; assert e['item_type_counts']['collab_tool_call'] == 1"
          python scripts/promote_run_capture.py /tmp/capture.json --score 0.98 --threshold 0.95 --grader synthetic-ci-fixture --output /tmp/benchmark.jsonl
          python scripts/summarize_benchmarks.py /tmp/benchmark.jsonl

      - name: Smoke-test stack-owned offline acceptance
        run: |
          python scripts/acceptance_core.py --offline --report /tmp/acceptance.md
          python scripts/acceptance_test_codex.py --offline --report /tmp/acceptance-compat.md

      - name: Check generated Codex adapter drift
        run: python scripts/generate_codex_adapter.py --check

  windows-acceptance-offline:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.9 compatibility floor
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Python 3.9 deterministic unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Smoke-test EAS distribution CLI on Windows
        shell: pwsh
        run: |
          python -m eas_cli version
          python -m eas_cli doctor --json
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\install.ps1), [ref]$null, [ref]$errors)
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }

      - name: Smoke-test UTF-8 subprocess capture on Windows
        shell: pwsh
        run: |
          python -c "import sys; sys.path.insert(0,'scripts'); import acceptance_core as a; p=a.run([sys.executable,'-c','import sys; sys.stdout.buffer.write(bytes([0xe2,0x9c,0x93]))']); assert p.stdout == '\u2713'; assert a.parse_jsonl_text(None) == []"

      - name: Smoke-test npm Codex shim resolution
        shell: pwsh
        run: |
          $shimDir = Join-Path $env:RUNNER_TEMP "codex-shim-test"
          New-Item -ItemType Directory -Force -Path $shimDir | Out-Null
          $ps1 = Join-Path $shimDir "codex.ps1"
          $cmd = Join-Path $shimDir "codex.cmd"
          Set-Content -LiteralPath $ps1 -Value 'Write-Output "ps1-shim"'
          Set-Content -LiteralPath $cmd -Value @('@echo off','echo %*') -Encoding ASCII
          $env:EAS_TEST_CODEX_PS1 = $ps1
          python -c "import os,sys; sys.path.insert(0,'scripts'); import acceptance_core as a; r=a.resolve_command(os.environ['EAS_TEST_CODEX_PS1']); print(r); assert r.lower().endswith('codex.cmd'); p=a.run(a.external_command(r,['exec','-'])); print(p.stdout); assert p.returncode == 0 and 'exec -' in p.stdout"

      - name: Run PowerShell stack-owned acceptance offline
        shell: pwsh
        run: |
          & .\scripts\acceptance-test.ps1 -Offline -Report "$env:RUNNER_TEMP\engineering-agent-stack-acceptance.md"
          Get-Content "$env:RUNNER_TEMP\engineering-agent-stack-acceptance.md"
