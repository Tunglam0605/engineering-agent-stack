version: 1
status: planned
objective: preserve-required-quality-while-minimizing-unnecessary-compute
primary_metric: quality_per_cost_latency
comparison_rule:
  quality_gate_first: true
  reject_below_threshold: true
  prefer_lower_compute_when_quality_is_equivalent: true
experiments:
  - id: scout-gpt6-luna-migration
    role: scout
    task_families:
      - repository-discovery
      - call-flow-tracing
    task_ids:
      - scout-symbol-001
    candidates:
      - profile: cheap
        model: gpt-5.6-luna
        reasoning: medium
      - profile: cheap
        model: gpt-6-luna
        reasoning: medium
      - profile: standard
        model: gpt-6-sol
        reasoning: medium
    measures:
      - quality_score
      - input_tokens
      - output_tokens
      - latency_ms
      - agent_invocations

  - id: implementer-gpt6-routing
    role: implementer
    task_families:
      - bounded-bug-fix
      - small-refactor
    task_ids:
      - implementer-bounded-bug-001
    candidates:
      - profile: standard
        model: gpt-5.6-terra
        reasoning: medium
      - profile: standard
        model: gpt-6-sol
        reasoning: medium
      - profile: standard
        model: gpt-6-luna
        reasoning: high
    measures:
      - quality_score
      - targeted_test_pass
      - input_tokens
      - output_tokens
      - latency_ms

  - id: reviewer-gpt6-sol-migration
    role: reviewer
    task_families:
      - regression-review
      - concurrency-review
      - release-review
    task_ids:
      - reviewer-regression-001
    candidates:
      - profile: deep
        model: gpt-5.6-terra
        reasoning: high
      - profile: deep
        model: gpt-6-sol
        reasoning: high
    measures:
      - quality_score
      - defect_recall
      - false_positive_rate
      - input_tokens
      - output_tokens
      - latency_ms

  - id: architect-gpt6-critical
    role: architect
    task_families:
      - architecture-review
      - release-critical-assurance
    task_ids:
      - reviewer-regression-001
    candidates:
      - profile: critical
        model: gpt-5.6-sol
        reasoning: high
      - profile: critical
        model: gpt-6-sol
        reasoning: high
      - profile: critical
        model: gpt-6-sol
        reasoning: xhigh
      - profile: critical
        model: gpt-6-astra
        reasoning: high
    measures:
      - quality_score
      - defect_recall
      - false_positive_rate
      - input_tokens
      - output_tokens
      - latency_ms

  - id: direct-vs-delegate-overhead
    role: orchestrator
    task_families:
      - trivial-edit
      - obvious-single-file-fix
    task_ids:
      - orchestrator-trivial-edit-001
    candidates:
      - topology: direct
      - topology: delegated
    measures:
      - quality_score
      - total_tokens
      - latency_ms
      - agent_invocations

  - id: context-packet-full-vs-bounded
    role: orchestrator
    task_families:
      - context-efficiency
    task_ids:
      - context-packet-synthetic-001
    candidates:
      - topology: full-context
      - topology: bounded-context-packet
    measures:
      - quality_score
      - context_size_chars
      - token_proxy
      - retained_evidence_count
      - input_tokens
      - latency_ms
acceptance:
  min_repetitions_per_task: 3
  no_default_change_from_single_run: true
  record_environment_and_model_version: true
