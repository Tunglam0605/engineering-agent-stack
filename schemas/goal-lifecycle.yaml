version: 2
status: candidate
purpose: durable-goal-lifecycle-state
required_fields:
  - version
  - goal_id
  - next_sequence
  - revision
  - created_at
  - updated_at
  - assignments
  - workflow
assignment_required_fields:
  - assignment_id
  - role
  - task_domain
  - state
  - write_scope
  - created_at
  - updated_at
assignment_optional_fields:
  - attempt_started_at
  - recovery
recovery:
  fields: [reason, evidence, phase, resumes, replacements, handoff]
  reasons: [TRANSIENT_TRANSPORT, TRANSPORT_CORRUPTION, AGENT_FAILURE]
  phases: [healthy, resume-ready, resuming, replacement-ready, replaced, escalated, resolved]
  max_resumes: 2
  max_replacements: 1
  evidence_max_chars: 4096
  handoff_contract: child-handoff.yaml
  enforcement: locked-workflow-transactions-no-native-dispatch
decision_values:
  - SPAWN
  - REUSE
  - ESCALATE
  - REJECT
notes:
  - Goal state is stored under Git metadata .git/eas/goals and updated atomically.
  - JSONL events are append-only observability and are not claimed to be a transactional audit ledger.
  - Provider-native child spawning is not transparently intercepted unless orchestration explicitly consults this gate.
  - State revision prevents stale-state overwrite; per-goal lock serializes evaluate-and-commit transactions.
  - Goal IDs are lowercase and Windows-reserved names are rejected for cross-platform path identity.
workflow_fields:
  checkpoint: nullable stage/evidence/created_at/revision object
  approvals: list of action/target/revision/approver/reason/executor_stopped_evidence/created_at/expires_at/id objects
  receipts: list of approval_id/action/assignment_id/state/revision/created_at objects
compatibility:
  read_versions: [1, 2]
  write_version: 2
  legacy_migration: on-next-mutation-only
export:
  format: eas-goal-trace
  version: 1
  authoritative: state
  observational: observations
  observations_transactional: false
  completeness_scope: readable-records-only-not-event-delivery
