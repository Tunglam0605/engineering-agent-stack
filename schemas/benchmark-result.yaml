version: 1
name: benchmark-result-v1
required_fields:
  - run_id
  - timestamp_utc
  - stack_commit
  - case_id
  - case_version
  - variant_id
  - provider
  - model
  - reasoning
  - input_tokens
  - output_tokens
  - latency_ms
  - quality_score
  - quality_threshold
  - validation_passed
  - synthetic
field_constraints:
  run_id: non-empty-string
  timestamp_utc: iso-8601-string
  stack_commit: non-empty-string
  case_id: non-empty-string
  case_version: positive-integer
  variant_id: non-empty-string
  provider: non-empty-string
  model: non-empty-string
  reasoning: non-empty-string
  input_tokens: non-negative-integer
  output_tokens: non-negative-integer
  latency_ms: positive-number
  quality_score: number-0-to-1
  quality_threshold: number-0-to-1
  validation_passed: boolean
  synthetic: boolean
optional_fields:
  - actual_cost_usd
  - delegated_agents
  - peak_parallel_agents
  - tool_calls
  - task_fingerprint
  - environment
  - notes
derived_fields:
  normalized_api_cost_usd:
    description: Estimated from machine-readable list-price snapshot when actual per-run cost is unavailable.
  quality_qualified:
    description: validation_passed AND quality_score >= quality_threshold.
notes:
  - Quality score must come from an explicit case rubric or independent evaluator.
  - Synthetic fixtures must never be used to promote a runtime/model default.
  - A single qualified run is evidence for debugging the harness, not enough evidence for a routing decision.
